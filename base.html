<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SecureVote - Sistema de votación criptográfico con respaldo blockchain sobre PostgreSQL. Votación segura, transparente e inmutable.">
    <meta name="theme-color" content="#0f172a">
    <title>SecureVote | Sistema de Votación Blockchain</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background glow elements for futuristic visual aesthetic -->
    <div class="glow-bg glow-primary"></div>
    <div class="glow-bg glow-secondary"></div>
    <div class="glow-bg glow-accent"></div>

    <header class="app-header">
        <nav class="navbar container">
            <a href="/" class="brand-logo" id="nav-brand-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
                    <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M9 12L11 14L15 10" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3b82f6"/>
                            <stop offset="0.5" stop-color="#06b6d4"/>
                            <stop offset="1" stop-color="#a855f7"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="brand-text">Secure<span>Vote</span></span>
            </a>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" id="nav-link-home">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Votar
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/results" class="nav-link {% if request.path == '/results' %}active{% endif %}" id="nav-link-results">
                        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        Resultados & Blockchain
                    </a>
                </li>
            </ul>

            <div class="db-status-badge" id="mysql-status">
                <span class="status-dot pulsing"></span>
                <span class="status-text">PostgreSQL Conectado</span>
            </div>
        </nav>
    </header>

    <main class="app-content container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="footer-content container">
            <p>&copy; 2026 SecureVote Ledger. Todos los derechos reservados.</p>
            <div class="footer-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Respaldo SHA-256 Inmutable</span>
            </div>
        </div>
    </footer>

    <!-- Global Application Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
